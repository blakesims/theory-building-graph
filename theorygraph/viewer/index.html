<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theory graph</title>
<script>
/* Resolve the theme before first paint so there is no flash. */
(function(){try{var t=localStorage.getItem('tg-theme');var dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}})();
</script>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f7;--paper:#ffffff;--paper-2:#eaeef2;--ink:#22303a;--muted:#5d6b76;--line:#d5dde3;--line-strong:#b9c4cc;
  --accent:#216783;--accent-ink:#154e65;--accent-bg:#e1edf2;--focus:#4687a0;--shadow:0 6px 24px rgba(35,48,60,.16);
  --warn:#b5832a;--warn-bg:#faf4e6;--danger:#b3412e;--danger-bg:#f9ebe8;--ok:#3f8a5a;
  --entity:#226a89;--operation:#98700b;--claim:#5f8470;--question:#8f5fa4;--case:#b26b47;--source:#697886;--trace:#467d84;--check-result:#586889;--evidence:#b26b47;
  --r-supports:#3f8a5a;--r-challenges:#c0432f;--r-potential-conflict:#c0432f;--r-answers:#8f5fa4;--r-revises:#d07a1a;--r-raises:#a97fbd;--r-motivates:#6e8fa3;--r-informs:#8ea3b1;--r-about:#b3bec6;--r-governs:#8a97a1;--r-checks:#4e8f97;--r-acts-on:#98700b;--r-depends-on:#216783;--r-default:#a9b5be;
  --label:#2c3a44;--label-outline:#f3f5f7;--hub-label:#ffffff;--select-ring:#142e40;--match-ring:#1f7a9c;--dim:0.16;
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#12161a;--paper:#1a2026;--paper-2:#232b32;--ink:#e2e7eb;--muted:#96a2ac;--line:#2c353d;--line-strong:#3e4a53;
  --accent:#6fb8d8;--accent-ink:#c3e4f2;--accent-bg:#1f3541;--focus:#7cc2df;--shadow:0 8px 28px rgba(0,0,0,.55);
  --warn:#d9a441;--warn-bg:#2e2716;--danger:#e0705c;--danger-bg:#34201c;--ok:#5fb37c;
  --entity:#3a93bd;--operation:#c9981f;--claim:#79a68a;--question:#b287c9;--case:#d18a5f;--source:#8a99a7;--trace:#5aa3ad;--check-result:#7f90b4;--evidence:#d18a5f;
  --r-supports:#5fb37c;--r-challenges:#e0705c;--r-potential-conflict:#e0705c;--r-answers:#b287c9;--r-revises:#e6963a;--r-raises:#b99bcc;--r-motivates:#7fa4ba;--r-informs:#6f8796;--r-about:#454f58;--r-governs:#5f6f7b;--r-checks:#5aa3ad;--r-acts-on:#c9981f;--r-depends-on:#6fb8d8;--r-default:#4a5661;
  --label:#d7dee4;--label-outline:#12161a;--hub-label:#0e1418;--select-ring:#f2f6f8;--match-ring:#7cc2df;--dim:0.14;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button,input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:6px 10px}
button{cursor:pointer}
button:hover{background:var(--paper-2)}
button:disabled{opacity:.5;cursor:default}
button[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.linklike{color:var(--accent);border:0;padding:0;background:transparent;text-align:left}
.linklike:hover{background:transparent;text-decoration:underline}
h3{font-size:12px;font-weight:600;letter-spacing:.01em;margin:0 0 6px;color:var(--muted);display:flex;align-items:baseline;gap:8px}
h3 small{font-weight:400;text-transform:none;letter-spacing:0;font-size:11px}

/* Header */
header{height:54px;flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--paper);position:relative;z-index:10}
h1{font-size:16px;margin:0;white-space:nowrap}
h1 span{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
.spacer{flex:1}
.toolbar-group{display:flex;gap:6px;align-items:center}
#live{font-size:12px;white-space:nowrap;color:var(--muted)}
#live.error{color:var(--danger)}
.options{position:relative}
.options summary{cursor:pointer;list-style:none;border:1px solid var(--line);border-radius:5px;padding:6px 10px;background:var(--paper)}
.options summary::-webkit-details-marker{display:none}
.options[open] .menu{position:absolute;right:0;top:40px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);width:260px;padding:14px;z-index:20;border-radius:6px}
.menu label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.menu button{width:100%;margin:4px 0}
.menu input[type=number]{width:64px}
.menu select{max-width:150px}

/* Layout */
#layout{flex:1;display:flex;min-height:0;position:relative}
#lens{width:320px;flex:none;border-right:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;min-height:0;padding:12px 14px 0;gap:10px;z-index:4}
.lens-groups{flex:none;max-height:52%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.lens-groups details summary{list-style:none;cursor:pointer}
.lens-groups details summary::-webkit-details-marker{display:none}
.lens-groups details summary h3{margin:0 0 6px}
.lens-groups details[open] summary h3::after{content:'−';margin-left:auto}
.lens-groups details summary h3::after{content:'+';margin-left:auto;color:var(--muted)}
#lens[hidden]{display:none}
.find-row{display:flex;gap:6px;flex:none}
#search{flex:1;min-width:0}
#clear-search{padding:6px 9px}
.scope{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border-radius:14px;line-height:1.2}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed=true] .n{color:inherit}
.chip.toggle{border-style:solid}
.chip.toggle[aria-pressed=false]{opacity:.5;text-decoration:line-through}
.chip.toggle[aria-pressed=true]{background:var(--paper);border-color:var(--line);color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--claim);flex:none}
.sw.entity{background:var(--entity)}.sw.operation{background:var(--operation);border-radius:2px}.sw.claim{background:var(--claim)}.sw.question{background:var(--question);border-radius:1px;transform:rotate(45deg);width:9px;height:9px}.sw.case,.sw.evidence{background:var(--case);border-radius:2px}.sw.source{background:var(--source)}.sw.trace{background:var(--trace);border-radius:2px}.sw.check-result{background:var(--check-result);border-radius:2px}
.ln{display:inline-block;width:18px;height:0;border-top:2px solid var(--r-default);flex:none}
.ln.dashed{border-top-style:dashed}.ln.dotted{border-top-style:dotted;border-top-width:3px}
.match-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.match-row label{display:flex;align-items:center;gap:6px}
#results{flex:1;min-height:120px;overflow:auto;display:flex;flex-direction:column;gap:2px;padding-bottom:16px}
#results .hint{color:var(--muted);font-size:12px;margin:0}
#results-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:2px 0;flex:none}
#results-head:empty{display:none}
#results h4{font-size:12px;margin:10px 0 4px;color:var(--muted);font-weight:600}
.result{display:block;text-align:left;width:100%;border:0;border-top:1px solid var(--line);border-radius:0;padding:8px 4px;line-height:1.35;background:transparent}
.result:hover,.result:focus-visible{background:var(--paper-2)}
.result .title{display:flex;align-items:center;gap:7px}
.result .title span{overflow:hidden;text-overflow:ellipsis}
.result small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.result .why{color:var(--accent-ink)}
[data-theme=dark] .result .why{color:var(--accent)}
.result.current{background:var(--accent-bg)}

#canvas{flex:1;position:relative;min-width:0;outline:none;background:var(--bg)}
#canvas:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.statusline{position:absolute;top:12px;left:12px;z-index:2;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--bg) 88%,transparent);max-width:60%;padding:4px 7px;border-radius:3px;pointer-events:none}
.map-tools{position:absolute;bottom:16px;left:12px;z-index:2;display:flex;gap:5px}
.map-tools button{background:var(--paper)}
.legend{position:absolute;bottom:16px;left:150px;z-index:2;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 10px;display:flex;gap:12px;flex-wrap:wrap;pointer-events:none;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
#layout:has(#lens:not([hidden])) .legend{display:none}
#arranging{top:44px;color:var(--ink)}
#hint{position:absolute;bottom:18px;right:16px;font-size:12px;color:var(--muted);z-index:2;pointer-events:none}
.empty{position:absolute;inset:30% 20%;text-align:center;z-index:2;pointer-events:none;color:var(--muted)}
#tooltip{position:fixed;z-index:30;max-width:320px;background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.4;pointer-events:none}
#tooltip[hidden]{display:none}
#tooltip b{display:block;margin-bottom:2px}
#tooltip .k{color:var(--muted)}

/* Drawers */
.drawer{position:absolute;right:14px;top:14px;bottom:14px;width:390px;max-width:calc(100vw - 28px);background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:7px;z-index:6;overflow:auto;padding:18px}
.drawer[hidden]{display:none}
.drawer h2{font-size:18px;line-height:1.35;margin:0 32px 8px 0}
.drawer h3{margin:22px 0 8px}
.drawer p{white-space:pre-wrap;margin:8px 0}
.drawer .text{font-size:14px;line-height:1.5}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.close{position:absolute;right:10px;top:10px;padding:2px 9px;font-size:20px;border:0;line-height:1.2}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:11px;color:var(--muted)}
.badge.status-accepted{color:var(--ok);border-color:var(--ok)}
.badge.status-proposed{border-style:dashed;color:var(--ink)}
.badge.status-withdrawn{text-decoration:line-through}
.badge.status-open{color:var(--question);border-color:var(--question)}
.badge.review-needs-review{color:var(--warn);border-color:var(--warn)}
.badge.review-historical{opacity:.7;border-style:dashed}
.nodeid{font:11px/1.4 ui-monospace,monospace;color:var(--muted);margin:0 0 6px;overflow-wrap:anywhere}
.reasons{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.reason{font-size:11px;background:var(--accent-bg);color:var(--accent-ink);border-radius:4px;padding:2px 6px}
.review-note{border-left:3px solid var(--warn);padding:8px 12px;background:var(--warn-bg)}
.danger-note{border-left:3px solid var(--danger);padding:8px 12px;background:var(--danger-bg)}
.rel-row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.rel-row .related{flex:1;border:0}
.rel-row .info{border:0;border-radius:0;padding:0 10px;font-size:13px;color:var(--muted);background:transparent}
.rel-row .info:hover{color:var(--accent);background:var(--paper-2)}
.related{display:block;width:100%;text-align:left;border:0;padding:9px 4px;border-radius:0;line-height:1.4;background:transparent}
.related:hover{background:var(--paper-2)}
.related small{display:block;color:var(--muted);font-size:11px}
.rel{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.rel i{display:inline-block;width:14px;border-top:2px solid var(--r-default)}
.drawer details{border-top:1px solid var(--line);padding:12px 0;margin-top:12px}
.drawer summary{cursor:pointer;color:var(--accent)}
pre{font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:10px;border-radius:4px}
article{padding:12px 0;border-top:1px solid var(--line)}
article p{margin:5px 0}
article small{color:var(--muted)}
.endpoints{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.endpoints .arrow{color:var(--muted);font-size:12px;padding-left:6px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--muted)}

@media(max-width:820px){
  header{gap:7px;padding:8px 10px}
  h1 span{display:none}
  h1{font-size:14px}
  #live{display:none}
  #hint{display:none}
  .toolbar-group button{padding:6px}
  #lens{position:absolute;inset:0 auto 0 0;width:min(340px,92vw);box-shadow:var(--shadow)}
  .drawer{width:min(360px,calc(100vw - 20px));right:10px;top:10px;bottom:10px}
  .legend{display:none}
}
/* Project switcher */
#project-button{display:flex;align-items:baseline;gap:8px;max-width:340px;padding:5px 10px}
#project-button .name{font-size:15px;font-weight:600;letter-spacing:-.01em}
#project-button .caret{color:var(--muted);font-size:10px}
#project-button .meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#project-menu{position:absolute;left:14px;top:50px;z-index:30;width:380px;max-height:70vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px}
#project-menu[hidden]{display:none}
#project-menu .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 8px 8px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.project-row{display:block;width:100%;text-align:left;border:0;border-radius:6px;background:transparent;padding:8px 9px;line-height:1.35}
.project-row+.project-row{margin-top:1px}
.project-row:hover,.project-row:focus-visible{background:var(--paper-2)}
.project-row[aria-current=true]{background:var(--accent-bg);color:var(--accent-ink)}
.project-row .line{display:flex;align-items:baseline;gap:8px}
.project-row .name{font-weight:600}
.project-row kbd{margin-left:auto;font:inherit;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.project-row .stats{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.project-row .stats b{font-weight:600;color:var(--accent-ink)}
[data-theme=dark] .project-row .stats b{color:var(--accent)}
.project-row .where{display:block;font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;opacity:.8}
#project-menu .foot{padding:7px 9px 4px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <button id="lens-toggle" aria-pressed="true" aria-label="Show or hide the find panel" title="Find and filter (/)">☰ Find</button>
  <button id="project-button" aria-haspopup="listbox" aria-expanded="false" aria-controls="project-menu" title="Switch graph (p)"><span class="name">Theory graph</span><span class="caret">▾</span><span class="meta"></span></button>
  <div id="project-menu" role="listbox" aria-label="Theory graphs" hidden></div>
  <div class="toolbar-group"><button id="whole" aria-pressed="true">Whole graph</button><button id="near" aria-pressed="false" disabled>Neighborhood</button></div>
  <div class="spacer"></div>
  <span id="live" role="status">Connecting…</span>
  <button id="theme" aria-label="Switch theme" title="Theme: auto, light or dark">◐ Auto</button>
  <button id="history-button">History</button>
  <details class="options" id="options"><summary aria-label="Graph options">Options</summary><div class="menu">
    <label><span>Include historical</span><input type="checkbox" id="historical"></label>
    <label><span>Walk depth</span><input type="number" id="depth" min="0" max="12" value="2"></label>
    <label><span>Layout</span><select id="layout"><option value="hubs">Hubs (force)</option><option value="radial">Radial from selection</option><option value="layers">Layers from anchors</option></select></label>
    <label><span>Relation labels</span><input type="checkbox" id="edge-labels"></label>
    <button id="review-button">Review queue</button>
    <button id="questions-button">Question states</button>
    <button id="text-button">Text representation</button>
    <button id="reflow">Rearrange graph</button>
  </div></details>
</header>
<div id="layout">
  <aside id="lens" aria-label="Find and filter">
    <div class="find-row"><input id="search" type="search" autocomplete="off" aria-label="Find a node" placeholder="Search id, title, text…"><button id="clear-search" aria-label="Clear search" title="Clear">×</button></div>
    <div id="scope" class="scope"></div>
    <div class="lens-groups">
      <details open><summary><h3>Frontier <small>where the theory is unsettled</small><button class="linklike" id="all-frontier" style="font-size:11px">all</button></h3></summary><div id="facet-chips" class="chips"></div></details>
      <details open><summary><h3>Check findings <small id="codes-note"></small></h3></summary><div id="code-chips" class="chips"></div></details>
      <details open><summary><h3>Node types</h3></summary><div id="type-chips" class="chips"></div></details>
      <details open><summary><h3>Relations</h3></summary><div id="relation-chips" class="chips"></div></details>
    </div>
    <div class="match-row"><label><input type="checkbox" id="hide-others"> Hide non-matching</label><button id="clear-filters" class="linklike">Clear filters</button></div>
    <div id="results-head" class="head"></div>
    <div id="results" role="list" aria-label="Search results"></div>
  </aside>
  <main id="canvas" role="region" aria-label="Interactive theory graph. Use search to select nodes by keyboard." tabindex="0"></main>
  <div id="empty" class="empty" hidden></div>
  <div id="scope-canvas" class="statusline"></div>
  <div id="arranging" class="statusline" role="status" hidden>Arranging…</div>
  <div class="map-tools"><button id="zoom-in" aria-label="Zoom in">＋</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit">Fit</button></div>
  <div class="legend" aria-label="Node types"><span><i class="sw entity"></i>Entity</span><span><i class="sw operation"></i>Operation</span><span><i class="sw claim"></i>Claim</span><span><i class="sw question"></i>Question</span><span><i class="sw case"></i>Case</span><span><i class="sw source"></i>Source</span><span><i class="sw trace"></i>Trace</span><span><i class="sw check-result"></i>Check</span></div>
  <div id="hint">Click a node or relation · double-click for neighborhood · <kbd>/</kbd> search · <kbd>p</kbd> switch graph · <kbd>Esc</kbd> clear</div>
  <aside id="inspector" class="drawer" aria-label="Node details" hidden><button class="close" aria-label="Close details">×</button><div id="detail"></div></aside>
  <aside id="activity" class="drawer" aria-label="Graph information" hidden><button class="close" aria-label="Close panel">×</button><h2 id="activity-title"></h2><div id="activity-body"></div></aside>
</div>
<div id="tooltip" role="tooltip" hidden></div>
<script src="/vendor/cytoscape.min.js"></script>
<script src="/vendor/layout-base.js"></script>
<script src="/vendor/cose-base.js"></script>
<script src="/vendor/cytoscape-fcose.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined&&text!==null)n.textContent=text;if(cls)n.className=cls;return n};
const cssVar=name=>getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const TYPE_ORDER=['entity','operation','claim','question','case','evidence','source','trace','check-result'];
const RELATION_STYLE={'potential-conflict':'dashed',challenges:'solid',revises:'dotted',checks:'dotted',answers:'solid','acts-on':'dashed','depends-on':'dashed'};
const OPEN_STATES=new Set(['open','candidate-answer','partial-answer']);
const rs=n=>n?.meta?.review_state||'current';
const caption=(id,n)=>n?.meta?.title||id;
const snippet=(text,max)=>{text=(text||'').replace(/\s+/g,' ').trim();return text.length>max?text.slice(0,max-1)+'…':text};

/* Positions: Whole mode keeps its own cache (persisted per project), so a trip
   through Neighborhood never disturbs the whole-graph arrangement. shownMode is
   the mode the elements currently on the canvas belong to. */
const state={selected:'',selectedEdge:'',mode:'whole',shownMode:'',revision:-1,snapshot:{nodes:{},edges:{}},adj:new Map(),tension:new Map(),requestId:0,first:true,activityKind:null,
  wholePos:new Map(),nearPos:new Map(),layoutToken:0,
  types:{node_types:{},edge_types:{}},questionStates:{},resolutions:{},findings:[],codeNodes:new Map(),auxRevision:-1,auxSig:'',
  facets:new Set(),codes:new Set(),hiddenTypes:new Set(),hiddenRelations:new Set(),hideOthers:false,query:'',matched:new Set(),remote:null,
  project:new URLSearchParams(location.search).get('p')||''};
const snapshot=()=>state.snapshot;

/* ---------- Theme ---------- */
function themePreference(){return store.get('tg-theme')||'auto'}
function applyTheme(pref){
  if(pref==='auto')store.set('tg-theme','auto');else store.set('tg-theme',pref);
  const dark=pref==='dark'||(pref==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';

  $('scope').textContent=text;$('scope-canvas').textContent=text;
}

/* ---------- Chips ---------- */
function chip(label,count,pressed,cls,onClick,title){
  const b=el('button',undefined,'chip'+(cls?' '+cls:''));b.setAttribute('aria-pressed',String(pressed));if(title)b.title=title;
  if(typeof label==='string')b.append(el('span',label));else b.append(...label);
  if(count!==undefined)b.append(el('span',String(count),'n'));
  b.onclick=onClick;return b;
}
function renderChips(){
  const g=snapshot(),nodes=Object.entries(g.nodes);
  const facets=$('facet-chips');facets.replaceChildren();
  for(const f of FACETS){
    const count=nodes.filter(([id,n])=>f.test(id,n)).length;
    if(f.id==='historical'&&!count)continue;
    facets.append(chip(f.label,count,state.facets.has(f.id),'',()=>{state.facets.has(f.id)?state.facets.delete(f.id):state.facets.add(f.id);renderChips();applyFilters()},f.hint));
  }
  const codes=$('code-chips');codes.replaceChildren();
  if(!state.codeNodes.size)codes.append(el('span',state.auxRevision>=0?'No findings from declared checks.':'Loading…','scope'));
  for(const [code,ids] of [...state.codeNodes].sort()){
    const count=[...ids.keys()].filter(id=>g.nodes[id]).length;
    codes.append(chip(code,count,state.codes.has(code),'',()=>{state.codes.has(code)?state.codes.delete(code):state.codes.add(code);renderChips();applyFilters()},[...ids.values()][0]));
  }
  const types=$('type-chips');types.replaceChildren();
  const typeNames=[...new Set([...TYPE_ORDER.filter(t=>state.types.node_types?.[t]||nodes.some(([,n])=>n.type===t)),...Object.keys(state.types.node_types||{}),...nodes.map(([,n])=>n.type)])];
  for(const t of typeNames){
    const count=nodes.filter(([,n])=>n.type===t).length;
    const sw=el('i',undefined,'sw '+t);
    types.append(chip([sw,el('span',t)],count,!state.hiddenTypes.has(t),'toggle',()=>{state.hiddenTypes.has(t)?state.hiddenTypes.delete(t):state.hiddenTypes.add(t);renderChips();applyFilters()},state.types.node_types?.[t]?.description||''));
  }
  const rels=$('relation-chips');rels.replaceChildren();
  const edgeList=Object.values(g.edges);
  const relNames=[...new Set([...Object.keys(state.types.edge_types||{}),...edgeList.map(e=>e.type)])];
  for(const r of relNames){
    const count=edgeList.filter(e=>e.type===r).length;
    const ln=el('i',undefined,'ln '+(RELATION_STYLE[r]||''));ln.style.borderTopColor=relColor(r);
    rels.append(chip([ln,el('span',r)],count,!state.hiddenRelations.has(r),'toggle',()=>{state.hiddenRelations.has(r)?state.hiddenRelations.delete(r):state.hiddenRelations.add(r);renderChips();applyFilters()},state.types.edge_types?.[r]?.description||''));
  }
}

/* ---------- Results ---------- */
function rank(id,n,q){
  if(!q.terms.length)return 0;
  const full=q.terms.join(' '),title=(n.meta?.title||'').toLowerCase(),lid=id.toLowerCase();
  if(lid===full||title===full)return 0;
  if(lid.startsWith(full)||title.startsWith(full))return 1;
  if(lid.includes(full)||title.includes(full)||(n.meta?.aliases||[]).some(a=>a.toLowerCase().includes(full)))return 2;
  return 3;
}
function resultButton(id,n,why,extra){
  const b=el('button',undefined,'result'+(id===state.selected?' current':''));b.setAttribute('role','listitem');b.dataset.id=id;
  const title=el('div',undefined,'title');title.append(el('i',undefined,'sw '+n.type),el('span',caption(id,n)));b.append(title);
  b.append(el('small',`${n.type} · ${n.status||'unset'} · ${rs(n)}${n.meta?.title?' · '+id:''}`));
  if(why)b.append(el('small',why,'why'));
  if(extra)b.append(el('small',extra));
  return b;
}
let remoteTimer,resultsKey='';
const RESULTS_PAGE=50;
/* Rebuilds the list only when the matched set, the query or the snapshot changed;
   otherwise it just moves the "current" highlight. Rows are added 50 at a time. */
function renderResults(){
  const box=$('results'),head=$('results-head'),g=snapshot(),q=parseQuery(state.query),active=isFilterActive();
  const key=active?JSON.stringify([q,[...state.facets],[...state.codes],state.revision,state.auxSig,state.mode,[...state.matched]]):JSON.stringify(['idle',state.revision,Object.keys(g.nodes).length]);
  if(key===resultsKey&&box.firstChild){for(const b of box.querySelectorAll('.result[data-id]'))b.classList.toggle('current',b.dataset.id===state.selected);return}
  resultsKey=key;
  box.replaceChildren();head.replaceChildren();
  if(!active){box.append(el('p',`${Object.keys(g.nodes).length} nodes in view. Type to search, or pick a frontier facet to spotlight where the theory is unsettled. Operators: type: status: review: rel: id:`,'hint'));return}
  const items=[...state.matched].map(id=>[id,g.nodes[id]]).sort((a,b)=>rank(a[0],a[1],q)-rank(b[0],b[1],q)||TYPE_ORDER.indexOf(a[1].type)-TYPE_ORDER.indexOf(b[1].type)||caption(a[0],a[1]).localeCompare(caption(b[0],b[1])));
  const parts=[];if(q.terms.length)parts.push('“'+q.terms.join(' ')+'”');for(const f of FACETS)if(state.facets.has(f.id))parts.push(f.label.toLowerCase());for(const code of state.codes)parts.push(code);
  head.append(el('span',items.length+' matching'+(parts.length>1?' all of: '+parts.join(' + '):parts.length?' '+parts[0]:'')));
  const fit=el('button','Zoom to matches','linklike');fit.onclick=fitView;head.append(fit);
  const more=el('button','','linklike more');more.style.padding='8px 4px';
  let shown=0;
  const addRows=()=>{
    const end=Math.min(items.length,shown+RESULTS_PAGE);
    for(const [id,n] of items.slice(shown,end)){
      const why=nodeReasons(id,n).join(' · ');
      let extra='';
      if(q.terms.length){const t=(n.text||'').toLowerCase();const i=t.indexOf(q.terms[0]);if(i>=0)extra='…'+snippet(n.text.slice(Math.max(0,i-40)),120)}
      const b=resultButton(id,n,why,extra);b.onclick=()=>choose(id);box.insertBefore(b,more);
    }
    shown=end;
    const rest=items.length-shown;
    if(rest>0)more.textContent=`Show ${Math.min(rest,RESULTS_PAGE)} more (${rest} not shown)`;else more.remove();
  };
  more.onclick=()=>{const first=shown;addRows();box.querySelectorAll('.result')[first]?.focus()};
  box.append(more);addRows();
  if(!items.length)box.append(el('p','No matching nodes in this view.','hint'));
  if(q.terms.length){
    const remoteBox=el('div');box.append(remoteBox);
    clearTimeout(remoteTimer);
    remoteTimer=setTimeout(async()=>{
      try{
        const r=await api('/api/search?q='+encodeURIComponent(q.terms.join(' ')));
        if(parseQuery(state.query).terms.join(' ')!==q.terms.join(' ')||!box.contains(remoteBox))return;
        const others=Object.entries(r.nodes).filter(([id])=>!g.nodes[id]);
        if(!others.length)return;
        remoteBox.append(el('h4','Not in this view (historical or beyond the current walk)'));
        for(const [id,n] of others){const b=resultButton(id,n,'');b.onclick=()=>{state.selected=id;state.mode='whole';$('historical').checked=true;selectMode('whole');choose(id)};remoteBox.append(b)}
      }catch{}
    },150);
  }
}

function relTag(type,dir){const s=el('span',undefined,'rel');const i=el('i');i.style.borderTopColor=relColor(type);i.style.borderTopStyle=RELATION_STYLE[type]||'solid';s.append(el('span',dir),i,el('span',type));return s}

let searchTimer;
$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.query=$('search').value;applyFilters()},120)};
$('search').onkeydown=e=>{
  if(e.key==='Enter'){clearTimeout(searchTimer);state.query=$('search').value;applyFilters();const first=$('results').querySelector('.result');if(first)first.click()}
  if(e.key==='ArrowDown'){const first=$('results').querySelector('.result');if(first){e.preventDefault();first.focus()}}
};
$('results').addEventListener('keydown',e=>{
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
  const items=[...$('results').querySelectorAll('.result')],i=items.indexOf(document.activeElement);if(i<0)return;e.preventDefault();
  const next=items[i+(e.key==='ArrowDown'?1:-1)];if(next)next.focus();else if(e.key==='ArrowUp')$('search').focus();
});
$('clear-search').onclick=()=>{$('search').value='';state.query='';applyFilters();$('search').focus()};
/* Clear every filter: search, facets, check codes, hidden types and relations, Hide non-matching. */
function clearFilters(){
  clearTimeout(searchTimer);
  state.facets.clear();state.codes.clear();state.hiddenTypes.clear();state.hiddenRelations.clear();
  $('search').value='';state.query='';
  $('hide-others').checked=false;state.hideOthers=false;
  renderChips();applyFilters();
}
const findOpen=()=>!$('lens').hidden;
function openFind(){$('lens').hidden=false;$('lens-toggle').setAttribute('aria-pressed','true');store.set('tg-lens','1')}
/* Closing Find (button or Escape) also clears the filters. Selection and the inspector are left alone. */
function closeFind(){
  const hadFocus=$('lens').contains(document.activeElement);
  $('lens').hidden=true;$('lens-toggle').setAttribute('aria-pressed','false');store.set('tg-lens','0');
  clearFilters();
  if(hadFocus)$('canvas').focus({preventScroll:true});
}
$('clear-filters').onclick=clearFilters;
$('all-frontier').onclick=e=>{e.preventDefault();e.stopPropagation();for(const f of ['open','tension','proposed','review','stale'])state.facets.add(f);renderChips();applyFilters()};
$('hide-others').onchange=()=>{state.hideOthers=$('hide-others').checked;applyFilters();if(state.hideOthers)fitView()};
$('lens-toggle').onclick=()=>findOpen()?closeFind():openFind();
$('theme').onclick=()=>{const order=['auto','light','dark'];applyTheme(order[(order.indexOf(themePreference())+1)%3])};
$('project-button').onclick=()=>projectMenuOpen()?closeProjectMenu(true):openProjectMenu();
$('project-menu').addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.stopPropagation();return closeProjectMenu(true)}
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
  const rows=[...$('project-menu').querySelectorAll('.project-row')],i=rows.indexOf(document.activeElement);
  if(i<0)return;e.preventDefault();
  const next=rows[(i+(e.key==='ArrowDown'?1:rows.length-1))%rows.length];next?.focus();
});
document.addEventListener('pointerdown',e=>{
  if(projectMenuOpen()&&!$('project-menu').contains(e.target)&&!$('project-button').contains(e.target))closeProjectMenu();
});
document.querySelectorAll('.close').forEach(b=>b.onclick=closePanels);
$('whole').onclick=()=>selectMode('whole');$('near').onclick=()=>selectMode('near');
$('historical').onchange=()=>{state.auxRevision=-1;refresh(true)};
$('depth').onchange=()=>{if(state.mode==='near')refresh(true)};
$('layout').onchange=()=>{state.layout=$('layout').value;store.set('tg-layout',state.layout);scheduleArrange()};
$('edge-labels').onchange=()=>cy.edges().toggleClass('labelled',$('edge-labels').checked);
$('history-button').onclick=()=>showActivity('history');$('review-button').onclick=()=>showActivity('review');$('questions-button').onclick=()=>showActivity('questions');$('text-button').onclick=()=>showActivity('text');
$('reflow').onclick=()=>{$('options').open=false;scheduleArrange()};
$('fit').onclick=fitView;
$('zoom-in').onclick=()=>cy.zoom({level:cy.zoom()*1.25,renderedPosition:{x:cy.width()/2,y:cy.height()/2}});
$('zoom-out').onclick=()=>cy.zoom({level:cy.zoom()/1.25,renderedPosition:{x:cy.width()/2,y:cy.height()/2}});
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if(e.key==='Escape'&&projectMenuOpen()){e.preventDefault();return closeProjectMenu(true)}
  if(e.key==='p'&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();return projectMenuOpen()?closeProjectMenu(true):openProjectMenu()}
  if(!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&/^[1-9]$/.test(e.key)&&catalog.projects.length>1){
    const p=catalog.projects[Number(e.key)-1];if(p){e.preventDefault();return switchProject(p.name)}
  }
  if(e.key==='Escape'&&findOpen()){e.preventDefault();e.stopPropagation();return closeFind()}
  if(e.key==='Escape'){closePanels();$('options').open=false;if(!typing){clearSelection();if(state.mode==='near')selectMode('whole')}}
  if(e.key==='/'&&!typing){e.preventDefault();if(!findOpen())openFind();$('search').focus();$('search').select()}
});
window.onhashchange=()=>{state.selected=decodeURIComponent(location.hash.slice(1));highlight()};
new ResizeObserver(()=>cy.resize()).observe($('canvas'));

/* ---------- Start ---------- */
applyTheme(themePreference());
state.layout=store.get('tg-layout')||'hubs';$('layout').value=state.layout;
if(store.get('tg-lens')==='0'||innerWidth<820){$('lens').hidden=true;$('lens-toggle').setAttribute('aria-pressed','false')}
state.selected=decodeURIComponent(location.hash.slice(1));
loadCatalog().then(()=>{loadWholePos();refresh()});
setInterval(async()=>{try{const s=await api('/api/status');if(s.revision!==state.revision)refresh();else{$('live').textContent='Live · r'+state.revision;$('live').className=''}}catch{$('live').textContent='Disconnected · retrying';$('live').className='error'}},1500);
</script>
</body>
</html>
