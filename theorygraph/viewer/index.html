<header><h1>Theory graph <span>Morphisms</span></h1><div class="search-wrap"><input id="search" type="search" autocomplete="off" aria-label="Find a node" placeholder="Find a node…"><div id="results" role="list" aria-label="Search results"></div></div><div class="toolbar-group"><button id="whole" aria-pressed="true">Whole graph</button><button id="near" aria-pressed="false" disabled>Neighborhood</button></div><div class="spacer"></div><span id="live" role="status">Connecting…</span><button id="history-button">History</button><details class="options" id="options"><summary aria-label="Graph options">Options</summary><div class="menu"><label><input type="checkbox" id="historical"> Include historical</label><label>Walk depth<input type="number" id="depth" min="0" max="12" value="2"></label><button id="review-button">Review queue</button><button id="text-button">Text representation</button><button id="reflow">Rearrange graph</button></div></details></header>

<script src="/vendor/cytoscape.min.js"></script><script>
const $=id=>document.getElementById(id),elem=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
let selected=decodeURIComponent(location.hash.slice(1)),mode='whole',revision=-1,snapshot={nodes:{},edges:{}},requestId=0,first=true,activityKind=null,positions=new Map();
const cy=cytoscape({container:$('canvas'),elements:[],minZoom:.12,maxZoom:3,wheelSensitivity:.22,selectionType:'single',boxSelectionEnabled:false,style:[
{selector:'node',style:{'background-color':'#658471','width':27,'height':27,'label':'data(label)','font-family':'system-ui','font-size':12,'color':'#30403c','text-valign':'bottom','text-margin-y':7,'text-wrap':'wrap','text-max-width':125,'text-outline-width':2,'text-outline-color':'#f5f7f8','border-width':1,'border-color':'#fff'}},
{selector:'node[kind="entity"]',style:{'background-color':'#226a89','width':74,'height':74,'font-size':16,'font-weight':650,'text-valign':'center','text-margin-y':0,'color':'#fff','text-outline-width':0,'text-max-width':100}},
{selector:'node[kind="operation"]',style:{'background-color':'#98700b','shape':'round-rectangle','width':49,'height':42,'font-size':12,'font-weight':600}},
{selector:'node[kind="question"]',style:{'background-color':'#9160a3','shape':'diamond','width':36,'height':40}},
{selector:'node[kind="case"],node[kind="evidence"]',style:{'background-color':'#b26b47','shape':'round-rectangle','width':32,'height':28}},
{selector:'node[kind="trace"]',style:{'background-color':'#467d84','shape':'tag','width':40,'height':29}},
{selector:'node[kind="check-result"]',style:{'background-color':'#586889','shape':'round-rectangle','width':29,'height':25}},
{selector:'node[kind="source"]',style:{'background-color':'#697886','shape':'hexagon','width':26,'height':26,'font-size':10}},
{selector:'node[review="needs-review"]',style:{'border-width':3,'border-color':'#bd872c'}},
{selector:'node[review="historical"]',style:{'opacity':.45,'border-style':'dashed'}},
{selector:'edge',style:{'width':1,'line-color':'#a7b4bd','target-arrow-color':'#a7b4bd','target-arrow-shape':'triangle','arrow-scale':.65,'curve-style':'bezier','opacity':.45,'label':'','font-size':10,'text-background-color':'#f5f7f8','text-background-opacity':.95,'text-background-padding':3,'text-rotation':'autorotate'}},
{selector:'edge[kind="about"],edge[kind="involves"],edge[kind="acts-on"]',style:{'width':1.5,'opacity':.4}},
{selector:'.faded',style:{'opacity':.28}},
{selector:'edge.emphasis',style:{'opacity':1,'width':2,'line-color':'#526d7b','target-arrow-color':'#526d7b','label':'data(kind)'}},
{selector:'node:selected',style:{'border-width':4,'border-color':'#142e40','overlay-opacity':0}}
]});
async function api(url){const r=await fetch(url,{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}
function caption(id,n){return n.meta?.title||id}
function closePanels(){ $('inspector').hidden=true;$('activity').hidden=true;activityKind=null; }
function clearSelection(){selected='';cy.elements().unselect().removeClass('faded emphasis');$('near').disabled=true;closePanels();history.replaceState(null,'',location.pathname)}
function highlight(){cy.batch(()=>{cy.elements().removeClass('faded emphasis').unselect();const node=cy.$id(selected);if(node.length){node.select();node.connectedEdges().addClass('emphasis');const vicinity=node.closedNeighborhood();cy.elements().not(vicinity).addClass('faded')}});$('near').disabled=!cy.$id(selected).length}
function choose(id,inspect=true){selected=id;history.replaceState(null,'','#'+encodeURIComponent(id));$('results').replaceChildren();highlight();if(inspect)showNode(id);if(mode==='near')refresh(true)}
cy.on('tap','node',e=>choose(e.target.id()));cy.on('tap',e=>{if(e.target===cy)clearSelection()});cy.on('dragfree','node',e=>positions.set(e.target.id(),e.target.position()));
function graphElements(g){return [...Object.entries(g.nodes).map(([id,n])=>({data:{id,label:caption(id,n),kind:n.type,review:n.meta?.review_state||'current'}})),...Object.entries(g.edges).map(([id,e])=>({data:{id:'edge:'+id,edgeId:id,source:e.from,target:e.to,kind:e.type}}))]}
function arrange(){if(!cy.nodes().length)return;const hubs=cy.nodes('[kind="entity"]');const hubRadius=Math.max(120,hubs.length*20);const center={x:0,y:0};hubs.forEach((n,i)=>{const theta=2*Math.PI*i/Math.max(1,hubs.length);n.position({x:Math.cos(theta)*hubRadius,y:Math.sin(theta)*hubRadius});n.lock()});cy.nodes().not(hubs).forEach((n,i)=>{const neighbors=n.neighborhood('node[kind="entity"]');let p=neighbors.length?neighbors[0].position():center;const theta=i*2.399963;const r=n.data('kind')==='operation'?110:230+(i%3)*55;n.position({x:p.x+Math.cos(theta)*r,y:p.y+Math.sin(theta)*r})});const layout=cy.layout({name:'cose',animate:false,randomize:false,fit:true,padding:70,nodeRepulsion:()=>11000,nodeOverlap:25,idealEdgeLength:e=>e.source().data('kind')==='entity'||e.target().data('kind')==='entity'?155:110,edgeElasticity:()=>100,gravity:.35,numIter:700,componentSpacing:110});layout.on('layoutstop',()=>{hubs.unlock();cy.nodes().forEach(n=>positions.set(n.id(),n.position()));cy.fit(undefined,65)});layout.run()}
function updateGraph(g,rearrange){cy.nodes().forEach(n=>positions.set(n.id(),n.position()));const incoming=graphElements(g),wanted=new Set(incoming.map(e=>e.data.id));cy.batch(()=>{cy.elements().filter(e=>!wanted.has(e.id())).remove();for(const item of incoming){let old=cy.$id(item.data.id);if(old.length&&item.data.source&&(old.data('source')!==item.data.source||old.data('target')!==item.data.target)){old.remove();old=cy.collection()}if(old.length)old.data(item.data);else{if(!item.data.source){let p=positions.get(item.data.id);if(!p){const links=Object.values(g.edges).filter(e=>e.from===item.data.id||e.to===item.data.id);const anchor=links.map(e=>e.from===item.data.id?e.to:e.from).map(i=>positions.get(i)).find(Boolean);p=anchor?{x:anchor.x+60,y:anchor.y+60}:{x:0,y:0}}item.position=p}cy.add(item)}}});snapshot=g;highlight();if(rearrange)arrange();$('empty').hidden=Object.keys(g.nodes).length>0;$('empty').textContent='No nodes in this view. Try including historical material or search for another node.';$('scope').textContent=`${mode==='whole'?'Whole graph':'Neighborhood'} · ${Object.keys(g.nodes).length} nodes · ${Object.keys(g.edges).length} relations${g.truncated?' · node limit reached':''}${g.edge_truncated?' · relation limit reached':''}`;if(!$('inspector').hidden&&selected)showNode(selected)}
async function refresh(rearrange=false){const seq=++requestId;try{const query=new URLSearchParams({current:$('historical').checked?'0':'1',limit:mode==='whole'?'500':'100',edge_limit:mode==='whole'?'2000':'400'});let route='/api/graph?';if(mode==='near'&&selected){route='/api/walk?';query.set('id',selected);query.set('depth',$('depth').value);query.set('direction','both')}const g=await api(route+query);if(seq!==requestId)return;revision=g.revision;updateGraph(g,first||rearrange);first=false;$('live').textContent='Live · r'+revision;$('live').className='';if(activityKind)showActivity(activityKind)}catch(e){$('live').textContent=e.message;$('live').className='error'}}
function selectMode(next){mode=next;$('whole').setAttribute('aria-pressed',String(mode==='whole'));$('near').setAttribute('aria-pressed',String(mode==='near'));refresh(true)}
async function showNode(id){let n=snapshot.nodes[id];if(!n){try{n=await api('/api/node?id='+encodeURIComponent(id))}catch{return}}closePanels();$('inspector').hidden=false;const body=$('detail');body.replaceChildren(elem('h2',caption(id,n)));body.append(elem('span',n.type,'badge'),elem('span',n.status||'unset','badge'),elem('span',n.meta?.review_state||'current','badge'),elem('p',n.text));if(n.meta?.synthetic)body.append(elem('p','SYNTHETIC FIXTURE — not observed runtime evidence.','review-note'));if(n.result_state)body.append(elem('p','Saved check: '+n.result_state+' · pattern '+n.result.outcome,'review-note'));if(n.meta?.review_reason)body.append(elem('p',n.meta.review_reason,'review-note'));const action=elem('button','View neighborhood');action.onclick=()=>{selectMode('near');};body.append(action);appendResponsibility(id,n,body);body.append(elem('h3','Related in this view'));let count=0;for(const [eid,e] of Object.entries(snapshot.edges)){if(e.from!==id&&e.to!==id)continue;count++;const other=e.from===id?e.to:e.from;const b=elem('button',undefined,'related');b.append(elem('small',e.from===id?`→ ${e.type}`:`← ${e.type}`),elem('span',caption(other,snapshot.nodes[other]||{})));b.onclick=()=>choose(other);body.append(b)}if(!count)body.append(elem('p','No connected relations in this view.'));const meta=elem('details');meta.append(elem('summary','Source and metadata'),elem('pre',JSON.stringify({id,...n.meta},null,2)));body.append(meta);if(n.pattern||n.type==='trace'||n.type==='check-result')appendEvaluations(id,n,body)}
async function appendResponsibility(id,n,body){
 const section=elem('section');body.append(section);
 try{
  if(n.type==='question'){
   const r=await api('/api/readiness?id='+encodeURIComponent(id));
   if(selected!==id||!body.contains(section))return;
   section.append(elem('h3','Question state'),elem('p',`Readiness: ${r.readiness} · Resolution: ${r.resolution||'unknown'}`));
   for(const b of r.blockers||[])section.append(elem('p',`${b.node||'Dependency'}: ${b.reason}`,'review-note'));
  }
  const checks=elem('button','Inspect checks');section.append(checks);
  checks.onclick=async()=>{checks.disabled=true;try{
   const report=await api('/api/check');if(selected!==id||!body.contains(section))return;
   const findings=(report.findings||[]).filter(f=>(f.nodes||[]).includes(id));
   section.append(elem('h3','Findings about this node'));
   if(!findings.length)section.append(elem('p','No findings in the declared checks. This is not a proof of completeness.'));
   for(const f of findings){section.append(elem('p',`${f.severity||'review'} · ${f.code}${f.suppressed?' · suppressed':''}`),elem('pre',JSON.stringify(f,null,2)))}checks.remove();
  }catch(e){section.append(elem('p','Checks unavailable: '+e.message));checks.disabled=false}};
  const button=elem('button','Show affected dependencies');section.append(button);
  button.onclick=async()=>{button.disabled=true;try{
   const r=await api('/api/impact?id='+encodeURIComponent(id)+'&limit=20');
   if(selected!==id||!body.contains(section))return;
   const d=elem('details');d.open=true;d.append(elem('summary','Declared dependency impact'),elem('pre',JSON.stringify(r,null,2)));section.append(d);button.remove();
  }catch(e){section.append(elem('p','Impact unavailable: '+e.message));button.disabled=false}};
 }catch(e){section.append(elem('p','Question state unavailable: '+e.message))}
}
async function appendEvaluations(id,n,body){
const section=elem('section');body.append(section);
if(n.pattern){section.append(elem('h3','Optional machine-readable pattern'),elem('p','Pattern standing: '+(n.meta?.pattern_standing||'unspecified')+'. Evaluations concern this pattern only.'),elem('pre',JSON.stringify(n.pattern,null,2)));if(n.meta?.pattern_scope)section.append(elem('p',n.meta.pattern_scope))}
if(n.trace){const d=elem('details');d.append(elem('summary','Recorded trace events'),elem('pre',JSON.stringify(n.trace,null,2)));section.append(d)}
section.append(elem('h3','Saved pattern evaluations'));
try{const packet=await api('/api/evaluations?id='+encodeURIComponent(id));if(!body.contains(section))return;if(!packet.results.length)section.append(elem('p','No saved evaluations. Use tg evaluate CLAIM TRACE --save to record a check.'));
for(const r of packet.results){const a=elem('article');a.append(elem('strong',`Pattern ${r.outcome} · ${r.result_state}`));if(r.synthetic)a.append(elem('p','Synthetic trace'));a.append(elem('small','Computed at graph revision '+r.computed_revision));if(r.result_state==='stale')a.append(elem('p','Inputs or checker changed. Re-evaluate before relying on this outcome.','review-note'));for(const [label,target] of [['Claim',r.claim],['Trace',r.trace]]){const b=elem('button',label+': '+target,'related');b.onclick=()=>choose(target);a.append(b)}if(r.witnesses?.length)a.append(elem('pre',JSON.stringify(r.witnesses,null,2)));if(r.diagnostics?.length){const d=elem('details');d.append(elem('summary','Diagnostics'),elem('pre',JSON.stringify(r.diagnostics,null,2)));a.append(d)}a.append(elem('small',r.scope));section.append(a)}}catch(e){section.append(elem('p','Evaluations unavailable: '+e.message))}}

async function showActivity(kind){activityKind=kind;$('inspector').hidden=true;$('activity').hidden=false;$('options').open=false;const body=$('activity-body');body.replaceChildren(elem('p','Loading…'));try{if(kind==='history'){$('activity-title').textContent='Change history';const h=await api('/api/history?limit=12');body.replaceChildren();for(const c of [...h.changes].reverse()){const a=elem('article');a.append(elem('strong',`r${c.revision} · ${c.actor}`),elem('p',c.reason),elem('small',c.at));for(const e of c.edits||[])a.append(elem('p',`${e.action||'Updated'} ${e.collection}/${e.id}${e.fields?' · '+e.fields.join(', '):''}`));body.append(a)}if(!h.changes.length)body.append(elem('p','No recorded changes.'))}else if(kind==='review'){$('activity-title').textContent='Review queue';const r=await api('/api/review');body.replaceChildren(elem('p',r.total+' items to revisit'));for(const [id,n] of Object.entries(r.nodes)){const b=elem('button',caption(id,n),'related');b.append(elem('small',n.meta?.review_reason||'Needs review'));b.onclick=()=>choose(id);body.append(b)}}else{$('activity-title').textContent='Current graph as text';const lines=[];for(const [id,n] of Object.entries(snapshot.nodes))lines.push(`${id} [${n.type}; ${n.status}; ${n.meta?.review_state||'current'}]\n${n.text}\n`);for(const e of Object.values(snapshot.edges))lines.push(`${e.from} —${e.type}→ ${e.to}`);body.replaceChildren(elem('pre',lines.join('\n')))}}catch(e){body.replaceChildren(elem('p',e.message))}}
let searchTimer;async function find(){const text=$('search').value.trim();if(!text){$('results').replaceChildren();return}try{const r=await api('/api/search?q='+encodeURIComponent(text));if($('search').value.trim()!==text)return;$('results').replaceChildren();for(const [id,n] of Object.entries(r.nodes)){const b=elem('button',caption(id,n));b.append(elem('small',n.type+' · '+(n.meta?.review_state||'current')));b.onclick=()=>{if(!snapshot.nodes[id]){selected=id;mode='whole';$('historical').checked=true;selectMode('whole')}choose(id)};$('results').append(b)}if(!Object.keys(r.nodes).length)$('results').append(elem('p','No matching nodes.'))}catch(e){$('live').textContent=e.message}}
$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(find,180)};$('search').onkeydown=e=>{if(e.key==='Escape')$('results').replaceChildren();if(e.key==='Enter')find()};document.querySelectorAll('.close').forEach(b=>b.onclick=closePanels);$('whole').onclick=()=>selectMode('whole');$('near').onclick=()=>selectMode('near');$('historical').onchange=()=>refresh(true);$('depth').onchange=()=>{if(mode==='near')refresh(true)};$('history-button').onclick=()=>showActivity('history');$('review-button').onclick=()=>showActivity('review');$('text-button').onclick=()=>showActivity('text');$('reflow').onclick=()=>{$('options').open=false;arrange()};$('fit').onclick=()=>cy.fit(undefined,65);$('zoom-in').onclick=()=>cy.zoom({level:cy.zoom()*1.25,renderedPosition:{x:cy.width()/2,y:cy.height()/2}});$('zoom-out').onclick=()=>cy.zoom({level:cy.zoom()/1.25,renderedPosition:{x:cy.width()/2,y:cy.height()/2}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanels();$('results').replaceChildren();$('options').open=false}});window.onhashchange=()=>{selected=decodeURIComponent(location.hash.slice(1));highlight()};new ResizeObserver(()=>cy.resize()).observe($('canvas'));
refresh();setInterval(async()=>{try{const state=await api('/api/status');if(state.revision!==revision)refresh();else{$('live').textContent='Live · r'+revision;$('live').className=''}}catch{$('live').textContent='Disconnected · retrying';$('live').className='error'}},1500);
</script></body></html>
