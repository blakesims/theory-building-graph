[project]
name = "theorygraph"
version = "0.2.3"
description = "A local, audited theory graph for program design"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Blake Sims" }]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/blakesims/theory-building-graph"

[project.scripts]
tg = "theorygraph.graph:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
theorygraph = ["template.json", "viewer/*.html", "viewer/vendor/*.js", "viewer/vendor/*.LICENSE", "skill/SKILL.md"]

[tool.setuptools.packages.find]
include = ["theorygraph*"]
